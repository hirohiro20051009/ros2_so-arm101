# MoveIt Servo（Diff-IK）の設定（Servo 専用。use_servo:=true のときだけ使う）
#
# 【別物】so_arm101_moveit_config/config/servo.yaml は MoveIt Setup Assistant 由来の元の設定で、
# 実行時には使われない（残してある）。このファイルとの違いは docs/servo_integration_plan.md を参照。
# bringup.launch.py が {"moveit_servo": このファイル} としてノード servo_node に渡す。
# 読んだ版: moveit_servo 2.5.10（キーは servo_parameters.cpp の宣言 36 個のうち、下に書いたもの）。
#
# 方針（docs/servo_integration_plan.md）:
#  - 出力は forward_position_controller（Float64MultiArray）。arm_controller（JTC）には出さない（排他。3.1）
#  - 入力は unitless。実速度 = 入力（-1..1）× scale。1 を超える成分は Servo が捨てる（初期の上限）
#  - 5 関節: drift は起動後に ~/change_drift_dimensions で設定する（パラメータは無い。2.4）。
#    robot_description_kinematics は渡さない（逆 Jacobian の経路。2.5）
#  - 関節速度の上限は servo_joint_limits.yaml（robot_description_planning）で別に渡す（3.3.1）

use_gazebo: false

command_in_type: "unitless"
scale:
  linear: 0.01       # m/s（入力 1.0 のとき）
  rotational: 0.05   # rad/s
  joint: 0.05        # rad/s

publish_period: 0.034
low_latency_mode: false

# 出力: forward_position_controller（position だけ。Float64MultiArray は位置か速度のどちらか一方）
command_out_type: std_msgs/Float64MultiArray
command_out_topic: /forward_position_controller/commands
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false

smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

is_primary_planning_scene_monitor: false

move_group_name: arm
planning_frame: base_link
ee_frame_name: gripper_frame_link
robot_link_command_frame: base_link

# 入力が 0.1 秒途切れたら stale（出力を止める）。stamp は now() を入れること
incoming_command_timeout: 0.1
num_outgoing_halt_msgs_to_publish: 4

# 特異点（5x5 の条件数。真下の把持姿勢で 20〜37、伸ばしきり近くで 66〜71。暫定。モックで調整）
lower_singularity_threshold: 40.0
hard_stop_singularity_threshold: 100.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margin: 0.1

# 0 以外にすると Servo の速度上限（servo_joint_limits.yaml）が無効になる。0 のままにする
override_velocity_scaling_factor: 0.0
halt_all_joints_in_joint_mode: true
halt_all_joints_in_cartesian_mode: true

cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status

check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
