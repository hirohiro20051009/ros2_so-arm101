# Servo 専用の関節の速度の上限（use_servo:=true のときだけ使う）
#
# bringup.launch.py が robot_description_planning として、servo_node だけに渡す。
# MoveIt の joint_limits.yaml（move_group が使う）・URDF の limit は変えない。
# Servo は RobotModelLoader がこの値でロボットモデルの関節の境界を上書きし（robot_model_loader.cpp）、
# enforceVelocityLimits が速度を縮める（enforce_limits.cpp）。
# servo.yaml の override_velocity_scaling_factor が 0.01 以上だと無効になる（0 のまま）。
# 値は docs/servo_integration_plan.md 3.3.1・3.5（初期の実機の試験）。
joint_limits:
  shoulder_pan:
    has_velocity_limits: true
    max_velocity: 0.3
  shoulder_lift:
    has_velocity_limits: true
    max_velocity: 0.3
  elbow_flex:
    has_velocity_limits: true
    max_velocity: 0.3
  wrist_flex:
    has_velocity_limits: true
    max_velocity: 0.3
  wrist_roll:
    has_velocity_limits: true
    max_velocity: 0.3
