# ros2_control コントローラ設定（mock / 実機 共通、ルート名前空間）
#
# 【このファイルが使われる】ros2_control_node がコントローラの設定として実行時に読むのは、
# このファイルだけ（so_arm101_bringup の bringup.launch.py が渡す）。hardware の試験も
# update_rate を読む。
# 【別物】so_arm101_moveit_config/config/ros2_controllers.yaml は MoveIt Setup Assistant の
# 生成物で、実行時にも試験でも使われない（編集しても動作は変わらない）。
#
# 出典: nimiCurtis/so101_ros2（MIT License）の so101_controllers.yaml の /follower ブロックに
# 基づく（LICENSE.so101_ros2、THIRD_PARTY_NOTICES.md）。上流（コミット b50872d）との値の差は、
# arm_controller の open_loop_control: true を足した 1 項目だけ（docs/inventory.md に記録）。
# 旧 so_arm101_controller パッケージから git mv で移した（履歴は git log --follow）。
# /follower と /leader の名前空間は廃止した。
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Servo 用（use_servo:=true のときだけ spawn する。--inactive で読み込むだけ。docs/servo_integration_plan.md 3.1）
    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

arm_controller:
  ros__parameters:
    update_rate: 25
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    gains:
      shoulder_pan:  {p: 0.0, i: 0.0, d: 0.0}
      shoulder_lift: {p: 0.0, i: 0.0, d: 0.0}
      elbow_flex:    {p: 0.0, i: 0.0, d: 0.0}
      wrist_flex:    {p: 0.0, i: 0.0, d: 0.0}
      wrist_roll:    {p: 0.0, i: 0.0, d: 0.0}

    open_loop_control: true
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    time_scaling: 1.1

gripper_controller:
  ros__parameters:
    type: position_controllers/GripperActionController
    joint: gripper

# Servo（Float64MultiArray）の出力を受ける。arm_controller と同じ関節の position を要求するので、
# ros2_control が同時に active にさせない（排他）。関節の順は Servo の arm グループの順
# （MoveIt の RobotModel で確認済み）と同じにすること。要素数しか検査されない（順は検査されない）。
forward_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
    interface_name: position
